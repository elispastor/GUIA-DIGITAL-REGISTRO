<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro — Guía Digital Cúcuta</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0b1c3a,#1e3a8a);min-height:100vh;padding:20px;color:#333}
  .container{max-width:600px;margin:0 auto;background:white;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
  .header{background:linear-gradient(135deg,#fbbf24,#f59e0b);padding:30px;text-align:center}
  .header h1{color:#0b1c3a;font-size:1.8rem;margin-bottom:8px}
  .header p{color:#0b1c3a;font-size:0.95rem;opacity:0.9}
  .form{padding:30px}
  .campo{margin-bottom:20px}
  .campo label{display:block;font-weight:bold;color:#0b1c3a;margin-bottom:8px;font-size:0.95rem}
  .campo input,.campo select,.campo textarea{
    width:100%;padding:14px;border:2px solid #e5e7eb;border-radius:12px;
    font-size:1rem;font-family:inherit;transition:border 0.2s;
  }
  .campo input:focus,.campo select:focus,.campo textarea:focus{
    outline:none;border-color:#fbbf24;
  }
  .campo textarea{resize:vertical;min-height:100px}
  .planes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .plan{
    padding:15px;border:2px solid #e5e7eb;border-radius:12px;text-align:center;
    cursor:pointer;transition:all 0.2s;
  }
  .plan:hover{border-color:#fbbf24}
  .plan.activo{background:#fbbf24;border-color:#fbbf24;color:#0b1c3a}
  .plan .nombre{font-weight:bold;font-size:1rem;margin-bottom:4px}
  .plan .precio{font-size:0.85rem;opacity:0.8}
  .btn{
    width:100%;padding:18px;background:linear-gradient(135deg,#fbbf24,#f59e0b);
    color:#0b1c3a;border:none;border-radius:50px;font-size:1.1rem;
    font-weight:bold;cursor:pointer;margin-top:10px;transition:transform 0.2s;
  }
  .btn:hover{transform:scale(1.02)}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📋 Registro NGE</h1>
    <p>Únete a la Guía Digital de Cúcuta</p>
  </div>
  
  <form class="form" id="formRegistro">
    
    <div class="campo">
      <label>👤 Tu nombre</label>
      <input type="text" name="nombre" required placeholder="Ej: Elis Pastor">
    </div>
    
    <div class="campo">
      <label>🏪 Nombre de tu negocio</label>
      <input type="text" name="negocio" required placeholder="Ej: Hidrocool">
    </div>
    
    <div class="campo">
      <label>📞 Teléfono / WhatsApp</label>
      <input type="tel" name="telefono" required placeholder="Ej: 3001234567">
    </div>
    
    <div class="campo">
      <label>📍 Dirección</label>
      <input type="text" name="direccion" placeholder="Ej: Av. 5 #10-20, Cúcuta">
    </div>
    
    <div class="campo">
      <label>📝 Descripción de tu negocio</label>
      <textarea name="descripcion" required placeholder="Cuéntanos qué haces..."></textarea>
    </div>
    
    <div class="campo">
      <label>🎯 Tipo de prospecto</label>
      <select name="tipo" required>
        <option value="">Selecciona...</option>
        <option value="negocio">Negocio</option>
        <option value="motorizado">Motorizado</option>
        <option value="particular">Particular</option>
        <option value="fundacion">Fundación</option>
        <option value="profesional">Profesional</option>
      </select>
    </div>
    
    <div class="campo">
      <label>💎 Elige tu plan</label>
      <div class="planes">
        <div class="plan" data-plan="basico">
          <div class="nombre">Básico</div>
          <div class="precio">$25.000</div>
        </div>
        <div class="plan" data-plan="pro">
          <div class="nombre">Pro</div>
          <div class="precio">$50.000</div>
        </div>
        <div class="plan" data-plan="elite">
          <div class="nombre">Élite</div>
          <div class="precio">$100.000</div>
        </div>
        <div class="plan" data-plan="eliteplus">
          <div class="nombre">Élite Plus</div>
          <div class="precio">$200.000</div>
        </div>
      </div>
      <input type="hidden" name="plan" id="planSeleccionado" required>
    </div>
    
    <div class="campo">
      <label>🖼️ Logo de tu negocio</label>
      <input type="file" name="logo" accept="image/*">
    </div>
    
    <div class="campo">
      <label>📸 Foto 1 de tu negocio</label>
      <input type="file" name="foto1" accept="image/*">
    </div>
    
    <div class="campo">
      <label>📸 Foto 2 de tu negocio</label>
      <input type="file" name="foto2" accept="image/*">
    </div>
    
    <button type="submit" class="btn">🚀 Crear mi tarjeta</button>
    
  </form>
</div>

<script>
  // Selección de plan
  const planes = document.querySelectorAll('.plan');
  const planInput = document.getElementById('planSeleccionado');
  
  planes.forEach(p => {
    p.addEventListener('click', () => {
      planes.forEach(x => x.classList.remove('activo'));
      p.classList.add('activo');
      planInput.value = p.dataset.plan;
    });
  });
  
  // Envío del formulario (por ahora solo muestra los datos)
  document.getElementById('formRegistro').addEventListener('submit', (e) => {
    e.preventDefault();
    const datos = new FormData(e.target);
    const resumen = {};
    for (let [key, value] of datos.entries()) {
      resumen[key] = value instanceof File ? value.name : value;
    }
    alert('✅ Datos capturados:\n\n' + JSON.stringify(resumen, null, 2));
  });
</script>
</body>
</html>
